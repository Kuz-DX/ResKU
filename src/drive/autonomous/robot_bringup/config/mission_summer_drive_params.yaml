# 파지 전 정지 유지, picking_command 수신 후 주행.
summer_supply_drive_node:
  ros__parameters:
    # --- 로봇팔 인터페이스 ---
    picking_command_topic: "/arm/picking_command"    # "파지 완료" (std_msgs/Empty)

    # --- 인지팀 인터페이스 (확정) ---
    traffic_result_topic: "/mission/summer_traffic/result"  # mission_manager_interfaces/MissionResult

    # --- 속도 ---
    cruise_vx: 0.3927       # m/s (200dps, wheel_radius_m=0.1125 기준)

    # --- /path Pure Pursuit 조향 보정 ---
    path_topic: "/path"
    base_frame: "base_link"
    fixed_frame: "odom"             # 마지막 경로를 로봇과 함께 돌지 않는 좌표계에 고정
    lookahead_distance_m: 0.5
    path_timeout_sec: 1.0            # 이후부터 hold-last 복구 모드
    hold_last_path_sec: 5.0          # 마지막 경로 추종 허용 시간; 이후 안전 정지
    tf_lookup_timeout_sec: 0.1
    max_angular_speed_rad_s: 0.9
    recovery_turn_threshold_rad: 0.7 # 약 40도 이상 틀어지면 전진 없이 제자리 회전
    recovery_turn_gain: 1.5

    # --- 출력/제어 주기 ---
    cmd_vel_output_topic: "/cmd_vel_auto"
    control_rate_hz: 20.0

current_ramp_node:
  ros__parameters:
    cmd_vel_input_topic: "/cmd_vel_auto"
    soft_current_limit_a: 40.0
    ramp_down_gain: 0.05
    ramp_up_rate: 0.2
    control_rate_hz: 20.0

stability_monitor_node:
  ros__parameters:
    fault_clear_dwell_sec: 4.0   # 코드 기본값 그대로(이 launch는 오버라이드 없음)
