# purepursuit_node(autonomous.planz_winter.py) 파라미터 --
# mission_winter_drive_planz.launch.py 전용.
#
# [2026-09-05 신규] autonomous.planz_params.yaml(PlanZ 원본)과 노드
# 구성/파라미터가 대부분 같고, straight_after_sec/straight_drive_dps
# (STRAIGHT_LOCK, autonomous.planz_winter.py 상단 docstring 참고)만 추가됐다.
# straight_after_sec/straight_drive_dps/use_outer_wheel_boost/
# target_linear_speed_m_s/lookahead_distance_m은 launch 인자로도 노출되며,
# mission_winter_drive_planz.launch.py의 Node parameters dict에서 이 yaml
# 값을 덮어쓴다(CLI 인자가 항상 이김) -- 여기 값은 CLI 인자 생략 시 쓰이는
# 기본값이자 참고 기록.
purepursuit_node:
  ros__parameters:
    # ---- 경로/프레임/타임아웃 ----
    path_topic: /path
    base_frame: base_link
    tf_lookup_timeout_sec: 0.1
    path_timeout_sec: 1.0

    # ---- pure pursuit 기본 (straight_after_sec 전까지만 적용) ----
    lookahead_distance_m: 0.5
    target_linear_speed_m_s: 0.3
    goal_tolerance_m: 0.3

    # ---- 차체/모터 보정 상수 (실측값, reduced_odom_bringup.launch.py와 동일) ----
    track_width_m: 0.4904
    wheel_radius_m: 0.1125
    left_motor_sign: 1.0
    right_motor_sign: -1.0
    control_rate_hz: 20.0
    cmd_topic: /motor_speed_cmd

    # ---- 속도 하드 클램프 ----
    max_wheel_speed_dps: 360.0

    # ---- 경사 주행용 ----
    use_outer_wheel_boost: false

    # ---- [2026-09-05 신규] STRAIGHT_LOCK ----
    # 이 시간이 지나면 영구적으로(1회성 래치) /path를 무시하고
    # straight_drive_dps로 직진 고정된다 (autonomous.planz_winter.py 참고).
    straight_after_sec: 35.0
    straight_drive_dps: 200.0
