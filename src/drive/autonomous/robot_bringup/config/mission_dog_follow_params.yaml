# mission_dog_follow_params.yaml — mission_dog_follow.launch.py 전용
# 파라미터(로봇개 추종 미션).
#
# dog_pose_topic은 인지팀과 아직 미확정인 PLACEHOLDER(우리 쪽 제안값,
# geometry_msgs/PointStamped, x=전방/y=좌측) -- dog_follow_node.cpp 상단
# docstring 참고. 나머지 게인/거리/속도값도 전부 실측 전 추정치라 튜닝 필요.

dog_follow_node:
  ros__parameters:
    # --- 인지팀 인터페이스 (PLACEHOLDER) ---
    dog_pose_topic: "/perception/dog_pose"    # geometry_msgs/PointStamped, robot-relative(x=전방,y=좌측)
    dog_pose_timeout_sec: 0.5                 # 이 시간 넘게 안 오면 "가림막"으로 판단 -> 정지

    # --- 추종 거리/속도 ---
    follow_distance_min_m: 1.5
    follow_distance_max_m: 2.5
    follow_distance_target_m: 2.0             # P제어 setpoint, 1.5~2.5m 중앙
    cruise_speed_mps: 1.0                     # 로봇개 순항 속도 추정치(feedforward)
    kp_distance: 0.5                          # 거리오차 -> vx 보정 게인
    kp_bearing: 1.0                           # 방향오차 -> wz 보정 게인
    max_vx_tracking: 1.5                      # TRACKING(정상 추종) 중 vx 상한
    max_vx_catchup: 2.5                       # CATCHUP(가림막 통과 후 따라잡기) 중 vx 상한
    max_wz: 1.0

    # --- 출력/제어 주기 ---
    cmd_vel_output_topic: "/cmd_vel_auto"
    state_topic: "/drive/dog_follow_state"
    debug_topic: "/dog_follow/debug"
    control_rate_hz: 20.0

current_ramp_node:
  ros__parameters:
    cmd_vel_input_topic: "/cmd_vel_auto"
    soft_current_limit_a: 40.0
    ramp_down_gain: 0.05
    ramp_up_rate: 0.2
    control_rate_hz: 20.0

stability_monitor_node:
  ros__parameters:
    fault_clear_dwell_sec: 4.0   # 코드 기본값 그대로(이 launch는 오버라이드 없음)
