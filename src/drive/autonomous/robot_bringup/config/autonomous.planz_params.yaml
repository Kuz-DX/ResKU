# purepursuit_node(autonomous.planz.py) 파라미터.
#
# [2026-09-02 복원] scripts/autonomous.planz.py는 dolbotz/purepursuit.py의
# 2026-08-27 시점(커밋 3e3d81782f39b3a6ffb6887bf9ea74f5e4350664) 코드를 그대로
# 되살린 것이라, 이 yaml도 그 시점 dolbotz/purepursuit.launch.py의
# DeclareLaunchArgument 기본값 세트만 담는다 -- 그 이후 dolbotz 쪽에 추가된
# escort_follow 전용 파라미터(use_distance_scaled_speed, use_bearing_steering,
# use_single_wheel_pivot, max_linear_accel_mps2 등)는 이 노드 코드 자체에
# 없으므로 여기 없다(넣어도 무시됨). 전체 파라미터 설명 근거는 각 항목의
# autonomous.planz.py 모듈 docstring 참고.
purepursuit_node:
  ros__parameters:
    # ---- 경로/프레임/타임아웃 ----
    path_topic: /path
    base_frame: base_link
    tf_lookup_timeout_sec: 0.1
    path_timeout_sec: 1.0

    # ---- pure pursuit 기본 ----
    lookahead_distance_m: 0.5
    target_linear_speed_m_s: 0.3
    goal_tolerance_m: 0.3

    # ---- 차체/모터 보정 상수 (실측값) ----
    # reduced_odom_bringup.launch.py 캘리브레이션 값(0.4904) -- launch.py의
    # Node parameters dict에서 이 값으로 덮어써지므로(항상 이김), 여기는
    # 참고용 기록.
    track_width_m: 0.4904
    wheel_radius_m: 0.1125
    left_motor_sign: 1.0
    right_motor_sign: -1.0
    control_rate_hz: 20.0
    cmd_topic: /motor_speed_cmd

    # ---- 속도 하드 클램프 ----
    # 2026-08-27 시점 자율주행 공통값(0.707m/s) -- launch.py의 Node
    # parameters dict에서 360.0으로 덮어써지므로 여기는 참고용 기록.
    max_wheel_speed_dps: 360.0

    # ---- 경사 주행용 (2026-08-27 신규) ----
    use_outer_wheel_boost: false
