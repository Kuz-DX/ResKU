# mission_fall_drive_params.yaml — 가을 미션(비전마커 순차 인식 구간)
# 속도/파라미터 정리 문서.
#
# [2026-09-01, 정정] mission_fall_drive.launch.py가 신규 생성됨 -- 단,
# nav2(MPPI)를 아예 안 쓰는 경량화 버전이라(reduced_odom_bringup.launch.py +
# slope_traverse_node + stability_monitor_node만, mission_spring_drive.
# launch.py와 동일 구성 -- 그쪽 모듈 docstring 참고) 아래 "가을 구간 속도는
# controller_server(MPPI) vx_max" 설명은 더 이상 안 맞는다. 이 파일은
# 여전히 어떤 launch에서도 로드되지 않는다(fall_marker_node 파라미터
# 정리용 문서일 뿐) -- 필요하면 mission_fall.launch.py(인지)가 로드하도록
# 연결할 것.
#
# --- 가을 구간 "속도"의 실체 (2026-09-01 갱신) ---
# fall_marker_node(비전 인식)는 인식만 하고 속도를 바꾸는 코드가 없다
# (fall_marker.py 확인 — cmd_vel/속도 관련 코드 없음). [2026-09-01 이전]
# 가을 구간의 실제 주행 속도는 controller_server(MPPI)의 vx_max
# (robot_bringup/config/our_mppi_params.yaml, 봄 등 Plan A 공유 미션과
# 값도 공유)로 정해졌었으나, [2026-09-01] mission_fall_drive.launch.py가
# MPPI를 안 쓰는 구성으로 새로 만들어지면서 이제는 slope_traverse_node의
# 파라미터(autonomous_params.yaml의 slope_exit_speed_/SLOPE_DRIVE 관련 값)가
# 가을 구간 주행 속도를 정한다 — our_mppi_params.yaml의 vx_max는 가을에는
# 더 이상 적용되지 않는다(봄도 mission_spring_drive.launch.py로 동일하게
# 전환됨, 여름/추종은 원래부터 MPPI 무관).
#
# 가을만 다른 속도를 쓰고 싶다면: mission_fall_drive.launch.py의
# slope_traverse_node Node(parameters=[...])에 autonomous_params.yaml 대신
# 가을 전용 yaml을 만들어 넘길 것(mission_winter_drive.launch.py가
# mission_winter_drive_params.yaml로 SLOPE_EXIT wz만 오버라이드하는 것과
# 동일 패턴).
#
# --- fall_marker_node 파라미터 (현재 상태: 코드 기본값만 있고 launch에서
# 노출 안 된 값 다수 — mission_fall.launch.py는 model_path만 인자로 받음) ---
fall_marker_node:
  ros__parameters:
    expected_sequence: ['']          # 실측 전 placeholder — 실제 마커 순서 확정 후 채울 것
                                      # (순서 매칭 로직 자체가 TODO, fall_marker.py 모듈 docstring 참고)
    model_path: ""                   # 기본값은 config/models/vision_makerv2.pt (get_models_dir() 조합)
    conf_threshold: 0.5
    confirm_frames: 5                # 좌/우 각 카메라, 이 프레임 수 연속 같은 마커여야 확정
    color_topic_left: "/side/left/image_raw/compressed"
    camera_info_topic_left: "/side/left/camera_info"
    color_topic_right: "/side/right/image_raw/compressed"
    camera_info_topic_right: "/side/right/camera_info"
