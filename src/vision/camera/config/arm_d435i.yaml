/**:
  ros__parameters:
    # 로봇팔용 D435i (기존 주행 카메라). 숫자 타입으로 해석되지 않도록 '_'를 붙인다.
    serial_no: "_339222071362"
    camera_name: "arm_camera"
    initial_reset: false

    # The driver publishes arm_camera_cam_link as its depth/base origin.
    # LOCK-only vehicle VPR: front_d435i_vpr_tf.launch.py owns base_link -> root.
    # Full articulated arm use: URDF owns the root. Never run both owners.
    base_frame_id: "cam_link"
    publish_tf: true

    enable_color: true
    enable_depth: true
    enable_infra1: false
    enable_infra2: false
    enable_gyro: false
    enable_accel: false
    pointcloud.enable: false
    align_depth.enable: true

    rgb_camera.color_profile: "640x480x30"
    depth_module.depth_profile: "640x480x30"
