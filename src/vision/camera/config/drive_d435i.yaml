/**:
  ros__parameters:
    # 주행용 D435i (기존 장비 시리얼). 숫자 타입으로 해석되지 않도록 '_'를 붙인다.
    serial_no: "_339222071362"
    camera_name: "drive_camera"
    initial_reset: false

    # 주행용 카메라는 RGB 스트림만 사용한다.
    enable_color: true
    enable_depth: false
    enable_infra1: false
    enable_infra2: false
    enable_gyro: false
    enable_accel: false
    pointcloud.enable: false
    align_depth.enable: false

    rgb_camera.color_profile: "640x480x30"
