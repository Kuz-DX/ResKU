joint_command_mux:
  ros__parameters:
    # Must exactly match position_controller.joints order.
    joint_names:
      - base_joint
      - shoulder_joint
      - elbow_joint
      - wrist_joint
      - gripper_joint

    manual_joint_names:
      - base_joint
      - shoulder_joint
      - elbow_joint
      - wrist_joint
    gripper_joint_name: gripper_joint

    # Commissioned command limits [rad]. Order must match joint_names.
    lower_limits: [-1.46955, -1.4818, -1.63541, -1.78041, 0.0]
    upper_limits: [1.72113, 1.71548, 1.6383, 1.78041, 2.59396]
    # Keep command ramps below each actuator's configured maximum velocity.
    # In particular, elbow RMD is limited to 5 deg/s (0.0873 rad/s), so use
    # 0.07 rad/s to leave tracking margin under load.
    velocity_limits: [0.1, 0.1, 0.07, 0.1, 0.2]
    # Latch a hold if the commanded position remains too far from encoder
    # feedback. Order must match joint_names. Tune on the assembled robot.
    following_error_limits: [0.2, 0.2, 0.2, 0.2, 0.4]
    following_error_timeout: 1.0

    # MANUAL_EE의 정식 시작/home 자세. 프로세스 시작 후 첫 home 이동은
    # 적재 자세의 elbow/wrist가 이미 목표에 있다는 전제로 shoulder만
    # 이동하고 나머지는 버튼 순간 자세를 홀드한다. 첫 home 완료 후
    # Circle로 복귀할 때는 아래 세 관절 모두를 목표값으로 이동한다.
    home_joint_names: [shoulder_joint, elbow_joint, wrist_joint]
    home_positions: [-0.55851, 1.58825, 1.51844]
    home_base_position: 0.0

    # MANUAL_EE 운반용 hold pose. 그리퍼는 포함하지 않으므로 물체를
    # 파지한 마지막 gripper_joint 위치를 그대로 유지한다.
    hold_joint_names: [base_joint, shoulder_joint, elbow_joint, wrist_joint]
    hold_positions: [0.0, -0.76044, 1.63830, 1.53290]
    hold_button: 3
    home_shoulder_clearance_position: 0.52359877560
    # shoulder가 비양수일 때 손목 간섭을 피하기 위한 1차 목표 (+75 deg).
    # shoulder가 안전 위치(+30 deg)에 도달한 뒤 정식 wrist home으로 이동한다.
    home_wrist_stage1_position: 1.308996938996
    home_branch_deadband: 0.03
    home_move_threshold: 0.03
    # Base Dynamixel settles about 0.04--0.05 rad from zero on hardware.
    # Keep the other arm joints at the tighter common tolerance below.
    home_base_tolerance: 0.05
    home_tolerance: 0.02
    home_dwell_time: 0.3
    home_phase_timeout: 60.0
    home_button: 1

    publish_rate: 20.0
    manual_timeout: 0.75
    gripper_timeout: 0.75
    # Block position commands until all five joints have reported once. After
    # one second, print the missing joint names again every five seconds.
    feedback_wait_warn_after: 1.0
    feedback_wait_log_interval: 5.0
    protective_stop_deceleration_time: 0.5
    manual_command_topic: /manual_joint_commands
    manual_ee_command_topic: /manual_ee_joint_commands
    manual_ee_ready_topic: /control/manual_ee_ready
    gripper_command_topic: /manual_gripper_command
    controller_command_topic: /position_controller/commands
