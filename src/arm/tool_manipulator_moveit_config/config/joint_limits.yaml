# joint_limits.yaml allows the dynamics properties specified in the URDF to be overwritten or augmented as needed

# Velocity limits remain hardware-specific.  Acceleration uses the same
# conservative 0.25 rad/s^2 bound enforced by arm_control_mode_manager for
# tool paths.  The arm housings are 3D-printed, but measured link inertias are
# unavailable, so this is an initial software-validated limit rather than a
# torque/inertia-derived maximum.
default_velocity_scaling_factor: 0.1
default_acceleration_scaling_factor: 1.0

# Specific joint properties can be changed with the keys [max_position, min_position, max_velocity, max_acceleration]
# Joint limits can be turned off with [has_velocity_limits, has_acceleration_limits]
joint_limits:
  base_joint:
    has_velocity_limits: true
    max_velocity: 0.480
    has_acceleration_limits: true
    max_acceleration: 0.25
  elbow_joint:
    has_velocity_limits: true
    max_velocity: 0.30
    has_acceleration_limits: true
    max_acceleration: 0.25
  shoulder_joint:
    has_velocity_limits: true
    max_velocity: 0.35
    has_acceleration_limits: true
    max_acceleration: 0.25
  wrist_pitch_joint:
    has_velocity_limits: true
    max_velocity: 0.30
    has_acceleration_limits: true
    max_acceleration: 0.25
  wrist_roll_joint:
    has_velocity_limits: true
    max_velocity: 0.240
    has_acceleration_limits: true
    max_acceleration: 0.25
  wrist_yaw_joint:
    has_velocity_limits: true
    max_velocity: 0.240
    has_acceleration_limits: true
    max_acceleration: 0.25
