# All values below require an operator measurement or an approved timing value.
# The nodes require only the values needed through development.stop_after_state.
# Start by teaching HOME, then advance one state at a time.  Use "done" only
# after every state has been measured and reviewed.
# WARNING: named_poses below contain bridge-reported rad values from an older
# calibration convention. They are NOT validated against current hardware.yaml.
# Raw captures are in measured_raw_poses.yaml; run scripts/convert_raw_poses.py.
# Current captures fail joint limits. Do not enable later stages before re-teaching.
development:
  stop_after_state: home
feedback:
  # /joint_states receive-age upper bound; set from the approved publisher rate.
  joint_state_max_age_s: 0.5
joint_names: [base_joint, shoulder_joint, elbow_joint, wrist_pitch_joint, wrist_roll_joint, wrist_yaw_joint]
named_poses:
  home: {base_joint: 0.030680, shoulder_joint: 1.555786, elbow_joint: 1.539904, wrist_pitch_joint: -1.651605, wrist_roll_joint: 0.009204, wrist_yaw_joint: 0.191748}
  docking_wait: {base_joint: 3.138525, shoulder_joint: 0.866032, elbow_joint: 1.385966, wrist_pitch_joint: -1.241802, wrist_roll_joint: 0.007670, wrist_yaw_joint: 0.205553}
  tool0_pre: {base_joint: null, shoulder_joint: null, elbow_joint: null, wrist_pitch_joint: null, wrist_roll_joint: null, wrist_yaw_joint: null}
  tool1_pre: {base_joint: 2.193593, shoulder_joint: 0.500735, elbow_joint: 1.555263, wrist_pitch_joint: -1.441991, wrist_roll_joint: 0.757787, wrist_yaw_joint: -0.518486}
  # Measured joint poses for reference; the FSM uses Cartesian docking and relative yaw.
  tool1_docking: {base_joint: 2.265690, shoulder_joint: 0.436332, elbow_joint: 1.572716, wrist_pitch_joint: -1.414415, wrist_roll_joint: 0.667282, wrist_yaw_joint: -0.788466}
  tool_lock1: {base_joint: 2.265690, shoulder_joint: 0.435285, elbow_joint: 1.568004, wrist_pitch_joint: -1.414764, wrist_roll_joint: 0.667282, wrist_yaw_joint: 0.865165}
  # Measured yaw difference: tool_lock1 - tool1_docking (not the FSM command).
  tool_lock: {wrist_yaw_joint: 0.865165, delta_rad: 1.653631}
  supply_pre: {base_joint: -2.379204, shoulder_joint: 0.974941, elbow_joint: 1.538508, wrist_pitch_joint: -1.569575, wrist_roll_joint: -0.133456, wrist_yaw_joint: 0.124252}
  supply_grasp: {base_joint: -2.258020, shoulder_joint: 0.694117, elbow_joint: 1.530130, wrist_pitch_joint: -1.451765, wrist_roll_joint: -0.608990, wrist_yaw_joint: -0.424913}
  stand: {base_joint: 0, shoulder_joint: 0, elbow_joint: 0, wrist_pitch_joint: 0, wrist_roll_joint: 0, wrist_yaw_joint: 0}
cartesian_targets:
  # Fixed tool-1 target expressed in base_actuator, not a teach joint pose.
  tool1_target:
    frame_id: base_actuator
    position_m: [null, null, null]
    orientation_xyzw: [null, null, null, null]
motion:
  # Physical EE alignment phase; 180-degree spacing is 2048 motor pulses.
  # Confirm the measured reference in the current Homing Offset convention.
  ee_align: {reference_raw: null, duration_s: null, tolerance_rad: null}
  # CCW in the ROS wrist_yaw_joint convention: +90 degrees.
  yaw_delta_rad: 1.5707963267948966
  # 현재 FSM은 insert.speed_m_s만 사용한다 (0.005 m/s = 5 mm/s).
  # 삽입 거리는 현재 TCP에서 tool1_target까지 계산하며 distance_m은 예약 필드다.
  insert: {distance_m: null, speed_m_s: 0.005}
  # 현재 FSM에서 retreat 두 필드는 미사용. null은 이동거리 0을 뜻하지 않는다.
  # 복귀는 docking_wait 이름 자세로 named_pose_duration_s 동안 이동한다.
  retreat: {distance_m: null, speed_m_s: 0.005}
  named_pose_duration_s: 60.0
  lock_duration_s: 30.0
  # Maximum spacing used to choose Cartesian position/orientation IK waypoints.
  ik_step_m: 0.002
  ik_orientation_step_rad: 0.02
  ik_limit_margin_rad: 0.01
timeouts_s:
  ee_align: null
  home: 120.0
  docking_wait: 120.0
  tool1_pre: 120.0
  tool1_target: 180.0
  lock: 90.0
  return_docking_wait: 120.0
  return_home: 120.0
