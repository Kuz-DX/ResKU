# Tool registry: the single source for selectable physical tools, TCP, rack
# collision, taught approach, and attachment motion. null means "measure it";
# real_tool_change.launch.py will refuse to start until the selected IDs below
# are enabled and every required value is valid.
# Autonomous IDs are fixed: tool/tag 0=gripper and tool/tag 1=drill. No tool or
# tag ID >= 2 may be added. model_id is an independent legacy CAD model number.
real_docking:
  enabled_tool_ids: [1]  # commission tag 1 drill first; full preflight still required
  # Set true only after tag 1's encoder-taught joint_path, rack collision, and
  # insertion/retreat measurements below have been bench-verified.
  physical_detach_supported: false

# Reserved state IDs published on /active_tool_id. They are not AprilTag IDs
# and must not appear as keys under tools.
state_ids:
  no_tool: 99
  unknown: -2

# Fixed rack/fixture world collision. Each selected tool's dock_fixture must
# reference an entry here; frame is a measured existing TF frame.
fixtures:
  case_1:
    frame: tool_case_1
    # Wall geometry copied from the URDF tool_case_1_shell, metres.
    primitives:
      - {type: box, size: [0.0208, 0.100, 0.080], xyz: [-0.008, 0.0, 0.0]}
      - {type: box, size: [0.016, 0.042, 0.080], xyz: [0.0104, -0.029, 0.0]}
      - {type: box, size: [0.016, 0.042, 0.080], xyz: [0.0104, 0.029, 0.0]}
      - {type: box, size: [0.016, 0.016, 0.015], xyz: [0.0104, 0.0, -0.0325]}
      - {type: box, size: [0.016, 0.016, 0.015], xyz: [0.0104, 0.0, 0.0325]}
  case_2:
    frame: tool_case_y_plus
    # Wall geometry copied from the URDF tool_case_walls, metres.
    primitives:
      - {type: box, size: [0.0208, 0.0468, 0.050], xyz: [-0.008, 0.0, 0.0]}
      - {type: box, size: [0.016, 0.0154, 0.050], xyz: [0.0104, -0.0157, 0.0]}
      - {type: box, size: [0.016, 0.0154, 0.050], xyz: [0.0104, 0.0157, 0.0]}

tools:
  # Logical IDs exposed to autonomy/UI are 0/1. ID 99 is the reserved
  # NO_TOOL state. model_id preserves the existing CAD/TF numbering.
  0:
    enabled: false
    name: gripper_pinion_tool
    model_id: 1
    tag_id: 0                    # confirmed rack slot AprilTag ID
    coarse_joint_goal: [null, null, null, null, null, null]  # rad, joint_names order
    tcp:
      frame: tool_1_tcp
      parent: ee_output_link
      xyz: [-0.090, 0.0, 0.0]       # m, CAD attachment->TCP; bench verify before enabling
      quat_xyzw: [0.0, -0.70710678, 0.0, 0.70710678]
    collision:
      # Attached tool: diameter 30 mm, length 50 mm, bottom at tcp_link +Z 12 mm.
      # ee_output_link shares TCP origin/+Z; its Z rotation leaves this cylinder unchanged.
      primitives:
        - type: cylinder
          radius: 0.015
          length: 0.050
          xyz: [0.0, 0.0, 0.037]
          quat_xyzw: [0.0, 0.0, 0.0, 1.0]
    dock_fixture: case_1          # tag 0 gripper
    actuator:
      type: dynamixel
      joint: ee_joint
      id: 4
      position_limits_rad: [-2.351592547829, 2.839398438376]
      # 2026-10-01 live capture: rack/open ~= raw 1941..1942; close=raw 2808.
      open_position_rad: -0.076699
      close_position_rad: 1.251728
    lock:
      joint: wrist_yaw_joint
      # Relative wrist_yaw rotation: clockwise viewed from TCP +Z toward the origin.
      attach_yaw_delta_rad: -1.5707963267948966
      joint_path: null  # use the 90-degree delta, not the previous taught path
    docking:
      descent_frame: world
      descent_direction: [1.0, 0.0, 0.0]  # insertion along world +X
      descent_distance_m: 0.030
      descent_speed_mps: 0.03  # same TCP linear speed as tcp_joy_teleop.py
      descent_timeout_sec: null
      retreat_frame: world
      retreat_direction: [-1.0, 0.0, 0.0]  # retreat along world -X
      retreat_distance_m: 0.030
      retreat_speed_mps: 0.03  # same TCP linear speed as tcp_joy_teleop.py
      retreat_timeout_sec: null

  1:
    enabled: true
    name: long_drillbit
    model_id: 2
    tag_id: 1
    coarse_joint_goal: [null, null, null, null, null, null]
    mass_kg: 0.050
    tcp:
      frame: tool_2_tcp
      parent: ee_output_link
      xyz: [0.0, 0.0600, 0.0]
      quat_xyzw: [0.0, 0.0, 0.0, 1.0]
    collision:
      # Same attached-tool envelope: bottom/top at TCP +Z 12/62 mm.
      primitives:
        - type: cylinder
          radius: 0.015
          length: 0.050
          xyz: [0.0, 0.0, 0.037]
          quat_xyzw: [0.0, 0.0, 0.0, 1.0]
    # World-frame collision occupied by the drill after autonomous release.
    # Uses the same primitive format as collision.primitives.
    rack_collision:
      frame: null
      primitives: null
    dock_fixture: case_2          # tag 1 drill, +Y
    actuator:
      type: dynamixel
      joint: ee_joint
      id: 4
      position_limits_rad: [-1.279339977097, 3.911651009108]
    lock:
      joint: wrist_yaw_joint
      # Operator-confirmed tag 1 capture: -7.142215 -> -5.612836 rad.
      # Positive relative yaw (+87.63 deg) supersedes the earlier -90 deg instruction.
      # Source poses remain archived in tag1_recorded_path.yaml, not replayable goals.
      attach_yaw_delta_rad: 1.529379
      joint_path: null  # yaw-only delta; preserve other arm joints
    docking:
      descent_frame: world
      descent_direction: [1.0, 0.0, 0.0]  # insertion along world +X
      descent_distance_m: 0.030
      descent_speed_mps: 0.03  # same TCP linear speed as tcp_joy_teleop.py
      descent_timeout_sec: null
      retreat_frame: world
      retreat_direction: [-1.0, 0.0, 0.0]  # retreat along world -X
      retreat_distance_m: 0.030
      retreat_speed_mps: 0.03  # same TCP linear speed as tcp_joy_teleop.py
      retreat_timeout_sec: null
