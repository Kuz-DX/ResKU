# Tool registry: the single source for selectable physical tools, TCP, rack
# collision, taught approach, and attachment motion. null means "measure it";
# real_tool_change.launch.py will refuse to start until the selected IDs below
# are enabled and every required value is valid.
real_docking:
  enabled_tool_ids: []  # set e.g. [0] only after that tool is completely measured
  physical_detach_supported: false  # no release motion implementation exists yet

# Reserved state IDs published on /active_tool_id. They are not AprilTag IDs
# and must not appear as keys under tools.
state_ids:
  no_tool: 99
  unknown: -2

# Fixed rack/fixture world collision. Each selected tool's dock_fixture must
# reference an entry here; frame is a measured existing TF frame.
fixtures: {}

tools:
  # Logical IDs exposed to autonomy/UI are 0/1. ID 99 is the reserved
  # NO_TOOL state. model_id preserves the existing CAD/TF numbering.
  0:
    enabled: false
    name: gripper_pinion_tool
    model_id: 1
    tag_id: 0                    # confirmed rack slot AprilTag ID
    coarse_joint_goal: [null, null, null, null, null, null]  # rad, joint_names order
    tcp:
      frame: tool_1_tcp
      parent: ee_output_link
      xyz: [-0.090, 0.0, 0.0]       # m, CAD attachment->TCP; bench verify before enabling
      quat_xyzw: [0.0, -0.70710678, 0.0, 0.70710678]
    collision:
      primitives: null            # measured boxes/cylinders in ee_output_link, m/rad
    dock_fixture: null            # key under fixtures
    actuator:
      type: dynamixel
      joint: ee_joint
      id: 4
      position_limits_rad: [-1.279339977097, 3.911651009108]
      open_position_rad: 0.0
    lock:
      joint: wrist_yaw_joint
      attach_yaw_delta_rad: null  # measured signed rad from current yaw position
      # positions_rad order: base, shoulder, elbow, wrist_pitch,
      # wrist_roll, wrist_yaw. ee_observed_rad is telemetry only.
      joint_path:
        - {name: unlock, positions_rad: [-3.057224, -0.065450, 1.362579, 0.803375, 0.044485, 0.050621], ee_observed_rad: 0.032214}
        - {name: lock_step1, positions_rad: [-3.057224, -0.065450, 1.362928, 0.803026, 0.044485, -0.420311], ee_observed_rad: 0.038350}
        - {name: lock_step2, positions_rad: [-3.057224, -0.065450, 1.363277, 0.802328, 0.044485, -0.788466], ee_observed_rad: 0.038350}
        - {name: lock, positions_rad: [-3.055690, -0.065450, 1.363975, 0.802503, 0.044485, -1.491029], ee_observed_rad: 0.036816}
    docking:
      descent_frame: null         # existing TF frame; usually measured fixture/world frame
      descent_direction: [null, null, null]  # unitless vector in descent_frame
      descent_distance_m: null
      descent_speed_mps: null
      descent_timeout_sec: null
      retreat_frame: null
      retreat_direction: [null, null, null]  # unitless vector in retreat_frame
      retreat_distance_m: null
      retreat_speed_mps: null
      retreat_timeout_sec: null

  1:
    enabled: false
    name: long_drillbit
    model_id: 2
    tag_id: 1
    coarse_joint_goal: [null, null, null, null, null, null]
    mass_kg: 0.050
    tcp:
      frame: tool_2_tcp
      parent: ee_output_link
      xyz: [0.0, 0.0600, 0.0]
      quat_xyzw: [0.0, 0.0, 0.0, 1.0]
    collision:
      primitives: null
    dock_fixture: null
    actuator:
      type: dynamixel
      joint: ee_joint
      id: 4
      position_limits_rad: [-1.279339977097, 3.911651009108]
    lock:
      joint: wrist_yaw_joint
      attach_yaw_delta_rad: null
    docking:
      descent_frame: null
      descent_direction: [null, null, null]
      descent_distance_m: null
      descent_speed_mps: null
      descent_timeout_sec: null
      retreat_frame: null
      retreat_direction: [null, null, null]
      retreat_distance_m: null
      retreat_speed_mps: null
      retreat_timeout_sec: null
