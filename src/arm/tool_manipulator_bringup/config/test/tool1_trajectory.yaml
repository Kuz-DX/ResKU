# Test tool1: fixed points 1-4, smooth camera-clear approach, taught docking endpoint.
# Point 17 TCP coincides with the tool_case_y_plus_docking origin (2026-11-02).
# Dynamixel ID 3 (wrist_yaw_joint) increases from point 4 to positive final yaw.
# Its final camera orientation is reversed at the user's request for tag visibility.
# Points 1-15 and all connecting joint lines were collision checked at 0.001 rad.
# Only the named toolbox mating contacts are accepted on the 15->16->17 tail.
# Camera and all other collisions remain checked. All joints retain 0.02 rad margin.
# Point 17 ends in HOLD, with no extra tag-normal advance.
