# Tool2: 17 waypoints; shared tool0/tool1 points 1-2.
# Point 3 keeps its taught arm posture, with base matched to point 2.
# Previous points 4-10 retained; final point uses the supply-box approach below.
# Six linear intermediate points added after previous point 4.
# Point 17: supply-box centre + 47.5 mm horizontally and +47.5 mm vertically
# in arm_world; distance = 95*sqrt(2)/2 mm, elevation = 45 deg above the
# horizontal circuit-box top. Keep the previous centre-to-TCP XY bearing.
# TCP +Z points toward the box centre (45 deg downward). A vertical-down
# axis-IK search found no solution within the existing 0.02-rad margins.
# Target tcp_link XYZ [m]: [-0.196497885754747, -0.09391877441257105, 0.2295].
# Selected over centre + [0, 0, 95*sqrt(2)/2] mm: TCP travel from point 16
# is 72.225 mm versus 95.035 mm. Keep point 16 wrist yaw to avoid an
# unnecessary 2.153-degree axial turn without changing TCP position/+Z.
# Only the endpoint pose is constrained; joint interpolation is not a TCP line.
# Times are ordering metadata; joint speed caps set execution timing.
execution_enabled: true
# TEMPORARY, tool2 test replay only, explicitly requested by the operator.
# wrist_link_yaw is the gripper housing; ee_actuator is its drive gear.
# Removing this field restores collision checking for the entire gripper.
temporary_ignored_collision_links: [wrist_link_yaw, ee_actuator, tool_spurgear, rack_left, rack_right]
timing_mode: joint_limits
# Tool 1 approaches the wrist-pitch lower guard at about 0.0064 rad/s.
# Retiming tool 2 to 0.006 rad/s on elbow/pitch avoids a fast commanded
# approach into the 0.05-rad guard band (outward feedback trip: 0.02 rad/s).
# These caps set segment durations; the manager still owns all motion guards.
joint_speed_limits_rad_s: [0.08, 0.04, 0.006, 0.006, 0.08, 0.08]
joint_names: [base_joint, shoulder_joint, elbow_joint, wrist_pitch_joint, wrist_roll_joint, wrist_yaw_joint]
# PHASE 2 DISABLED: uncomment this block after approach validation.
# Existing close-and-return sequencing holds the arm at the final waypoint,
# drives independent Dynamixel ID 4 (ee_joint), waits for close completion,
# then reverses this approach back to its starting waypoint.
# The previous close target must be confirmed with the actual supply box.
# after_path:
#   ee_close_rad: 1.251728
#   return_to_start: true
