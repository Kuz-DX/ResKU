# Shared camera/tag/servo/common-pose configuration for real tool docking.
# This is the single source for the external vision.apriltag inputs too; the
# tool package never modifies vision/camera source files.
vision_apriltag:
  ros__parameters:
    input_topic: /arm/camera/color/image_raw/compressed
    camera_info_topic: /arm/camera/color/camera_info
    centers_topic: /arm/apriltag/centers
    tag_size_cm: 2.0             # tag is 2 cm x 2 cm; this is one side length
    allowed_tag_ids: [0, 1]      # 0=gripper, 1=drill; ignore every tag ID >= 2

# Every null is a required measurement or commissioning choice. The real launch
# runs config_validator before it opens any motor port.
tag_pose_filter:
  ros__parameters:
    source_topic: /arm/apriltag/centers
    depth_topic: /arm/camera/aligned_depth_to_color/image_raw
    selected_tool_id_topic: /selected_tool_id
    valid_pose_topic: /tag_pose_valid
    status_topic: /tag_status
    expected_frame_id: arm_camera_color_optical_frame  # observed in /arm/apriltag/centers
    max_age_sec: 3.0              # maximum detector stamp age at filter receipt
    min_decision_margin: null     # lowest accepted recorded decision margin
    depth_range_m: [0.030, 0.110]  # user-specified 30..110 mm, Euclidean PnP distance
    max_depth_age_sec: null       # maximum RGB/depth timestamp skew
    max_depth_pnp_error_m: 0.010  # user-specified 10 mm: |aligned depth - PnP z|
    depth_window_radius_px: null  # median window radius in aligned-depth pixels

visual_servo_node:
  ros__parameters:
    valid_pose_topic: /tag_pose_valid
    twist_topic: /servo_node/delta_twist_cmds
    command_frame: ''             # intentionally use the filter-validated tag frame
    desired_tag_position_m: [null, null, null]  # [x,y,z] m in expected_frame_id
    kp_xy: null
    max_linear_velocity_mps: 0.03  # same TCP linear speed as tcp_joy_teleop.py
    rate_hz: 50.0                 # software loop rate, not a measured geometry value
    xy_tolerance_m: null
    stable_frame_count: null
    detection_timeout_sec: null

docking_motion_executor:
  ros__parameters:
    tool_id_topic: /selected_tool_id
    tool_id_message_type: int32
    motion_command_topic: /docking_command
    active_tool_id_topic: /active_tool_id
    cancel_topic: /tool_change/cancel
    status_topic: /docking_motion_status
    detection_topic: /tag_pose_valid
    detection_message_type: vision_json
    servo_enable_service: /visual_servo_node/enable
    servo_aligned_topic: /servo_aligned
    servo_twist_topic: /servo_node/delta_twist_cmds
    servo_command_frame: ''       # twist frame comes from selected tool docking.{descent,retreat}_frame
    planning_group: arm
    base_link: base_actuator
    end_effector_link: tcp_link
    joint_state_topic: /joint_states
    joint_names: [base_joint, shoulder_joint, elbow_joint, wrist_pitch_joint, wrist_roll_joint, wrist_yaw_joint]
    # SRDF arm/back, reordered to joint_names above (rad).
    docking_wait_joint_goal: [2.819457, 0.864811, 1.531177, -1.282643, 0.0, -0.038350]
    servo_rate_hz: 50.0
    coarse_timeout_sec: null
    xy_align_timeout_sec: null
    detection_timeout_sec: null
    lock_joint_name: wrist_yaw_joint
    lock_timeout_sec: null
    # Require live encoder feedback to move at least this far in the commanded
    # yaw direction after the lock trajectory reports success.  The 1.529379-rad
    # tag-1 lock must not be accepted on action success alone.
    lock_feedback_min_delta_rad: 1.2
    lock_feedback_timeout_sec: 1.0
    # Measured stop criterion after cancel/fault. A state change is not accepted
    # as a stopped arm until fresh joint feedback satisfies this threshold.
    cancel_stop_timeout_sec: null
    stopped_velocity_rad_s: null
    hardware_fault_topic: /control/hardware_fault
    attachment_timeout_sec: null
    post_lock_motion_timeout_sec: null
    mission_wait_joint_goal_yaml: '[]'  # replace with six measured joint radians
