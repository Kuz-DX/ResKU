tool_dock_tcp_sim:
  ros__parameters:
    # UI receives Int32 tool_id. Physical targets may use only tool IDs 0 or 1;
    # ID 99 is the reserved NO_TOOL state and never has a target pose.
    tool_id_topic: /selected_tool_id
    planning_group: arm
    base_link: base_actuator
    tcp_link: tcp_link
    joint_names: [base_joint, shoulder_joint, elbow_joint, wrist_pitch_joint, wrist_roll_joint, wrist_yaw_joint]
    target_position_tolerance_m: 0.002
    orientation_tolerance_rad: 3.14159265
    planning_timeout_sec: 20.0
    max_velocity: 0.15
    max_acceleration: 0.15
    target_poses_yaml: '{}'
