ui_tag1_docking:
  ros__parameters:
    # Taught replay only. Requires reviewed/calibrated execution_sequence.
    # No automatic homing, EE command, visual servo, attachment claim, or unlock.
    request_topic: /selected_tool_id
    cancel_topic: /tool_change/cancel
    hardware_fault_topic: /control/hardware_fault
    joint_state_topic: /joint_states
    arm_action: /arm_controller/follow_joint_trajectory
    status_topic: /ui_tag1_docking/status
    max_joint_speed_rad_s: 0.15
    min_segment_duration_sec: 1.0
    start_tolerance_rad: 0.05
    goal_tolerance_rad: 0.01
    max_start_velocity_rad_s: 0.02
    joint_state_timeout_sec: 1.0
    action_wait_timeout_sec: 10.0
