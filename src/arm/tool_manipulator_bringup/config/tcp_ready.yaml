# Managed TCP entry target. The live approach is sampled through MoveIt before
# execution; failure keeps HOLD and never falls back to an unchecked move.
tcp_ready:
  execution_enabled: true
  root_link: base_actuator
  controlled_link: tcp_link
  tool_id: 0
  joint_names: [base_joint, shoulder_joint, elbow_joint, wrist_pitch_joint, wrist_roll_joint, wrist_yaw_joint]
  # Fixed, measured TCP-capable pose; also the start of tool path 0.
  positions_rad: [-0.00766990393963507, 1.3056807708063805, 1.3669418648356366,
    -1.2812461346468489, 0.004601942363450018, 0.004601942363863465]
  duration_sec: 10.0
  # Never use TCP-ready as a large automatic recovery move.
  max_start_delta_rad: 0.35
  # Square-button HOME is explicit and still fully collision checked.
  max_home_delta_rad: 1.0
  collision_step_rad: 0.005
  # Timeout per sequential state-validity request (only one outstanding).
  # All samples must pass before L1 can authorize the ready motion.
  collision_timeout_sec: 15.0
  evaluation_translation_m: 0.01
  evaluation_rotation_rad: 0.08726646259971647
