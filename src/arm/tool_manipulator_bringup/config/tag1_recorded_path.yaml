# Operator-provided /joint_states captures, in original capture order.
# ARCHIVE ONLY: no launch/executor loads this file. Not ROS node parameters.
# Do not wrap yaw, clamp points, expand limits, or replay until calibration and
# approach / docking / return boundaries have been confirmed on the real arm.
format: tool_manipulator_recorded_path/v1
tag_id: 1
executable: false
units: rad
calibration_verified: false
capture_source:
  setup: source ~/ResKU/install/setup.bash
  command: ros2 launch rmd_joint_state_bridge joint_state_bridge.launch.py
  # Current installed launch resolves to the source launch; its default
  # calibration matches hardware.yaml (rounded offsets, no yaw wrapping).
  # This does not verify the encoder turn count or historical runtime params.
  launch_defaults_match_hardware_calibration: true
docking_waypoint_index: null  # 1-based; operator confirmation required
joint_names: [base_joint, shoulder_joint, elbow_joint, wrist_pitch_joint, wrist_roll_joint, wrist_yaw_joint, ee_joint]
# ee is retained as measured evidence, NOT a commanded goal.
ee_policy: no_new_command
