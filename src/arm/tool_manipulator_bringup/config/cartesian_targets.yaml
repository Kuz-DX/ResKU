# Reviewed tool approach goals. Measured joint goals are preferred and are
# planned globally by MoveIt from the feedback-verified BACK pose. Cartesian
# object references remain documentation; they are not treated as TCP poses.
targets:
  tool0:
    joint_names: [base_joint, shoulder_joint, elbow_joint, wrist_pitch_joint, wrist_roll_joint, wrist_yaw_joint]
    # 2026-11-01 capture `pre0`: collision-free approach pose before `finger`.
    pre_joint_goal_rad: [3.1001751723166735, 0.6403612785882697, 1.209862232156147,
      -1.427330240975674, -0.0030679615759781065, -0.021475731030191625]
    executable: true
    role: measured_collision_free_pre_dock
    final_capture_label: finger
    final_joint_goal_rad: [3.1001751723166735, 0.5722934777079072, 1.3671164350450915,
      -1.2596040892063745, -2.0694557179012918e-13, -0.05829126993944733]
    # Legacy final mating capture retained for comparison only.
    joint_goal_rad: [3.1231848841349588, 0.13823006976715305, 1.2369147556672264,
      -1.093099662587149, -0.00766990393963507, -0.013805827090765277]
    reference_frame_id: arm_world
    reference_object_position_m: [-0.394506, 0.0, 0.212964]
    surface_plane_tilt_from_world_xy_deg: 35.0
    approach_z_tilt_from_world_xy_deg: -55.0
    orientation_xyzw: [0.0, 0.9537169507482269, 0.0, 0.30070579950427306]
    # Final gear-mated pose, not a collision-free pre-dock.  The removal
    # workflow must first reach a separate pre-dock, rotate EE to retract the
    # rack, confirm the changed mechanism/scene state, then replan a straight
    # insertion from fresh feedback.
    final_role: measured_final_mating_after_rack_removal
    required_prior_stage: ee_rack_removal_confirmed
    required_final_motion: straight_tcp_approach
    # The collision-free pre-dock is 30 mm away from the final mating point
    # along TCP local -Z.  The subsequent insertion reverses this offset.
    pre_dock_offset_tcp_m: [0.0, 0.0, -0.030]
    rack_removal_ee_command:
      duration_s: 2.0
      velocity_rad_s: 5.0
      joint_direction: positive
      physical_direction: ccw
      physical_viewpoint: gripper_toward_motor
      # Do not declare success from the two-second command alone.  Accumulate
      # positive, unwrapped ee_joint feedback from the command start.
      completion_feedback: ee_joint_accumulated_positive_displacement
      # 10% completion tolerance around the nominal 5 rad/s * 2 s travel.
      minimum_displacement_rad: 9.0
      expected_displacement_rad: 10.0
    # After fresh /arm/docked=true feedback, retreat straight away from the
    # box along TCP -Z before MoveIt plans directly to BACK.
    retreat_distance_m: 0.030
    retreat_axis_tcp: [0.0, 0.0, -1.0]
  tool1:
    joint_names: [base_joint, shoulder_joint, elbow_joint, wrist_pitch_joint, wrist_roll_joint, wrist_yaw_joint]
    # Reviewed production approach endpoint. The test point-17 endpoint is
    # geometrically labelled as the centred 80 mm observation pose, but its
    # wrist_pitch is only 0.0005 rad inside the 0.02-rad planning boundary.
    # Keep the safer recorded endpoint as the executable pre-dock instead.
    pre_joint_goal_rad: [3.2888548092266077, 0.4934045542387666, 1.4027210346066878,
      -1.5432200926554531, -0.4801359866084125, -1.9527575429782145]
    pre_capture_label: production_tool1_trajectory_endpoint
    # Retained for diagnosis only: elbow=1.581792 exceeds the 1.577952 hard
    # soft-limit endpoint and the 1.557952 planning-margin endpoint.
    joint_goal_rad: [2.853204265467086, 0.6768386626181123, 1.5817918531455613,
      -1.418254454296793, -0.09357282806123068, -1.661301193279943]
    reference_frame_id: arm_world
    # Measured docking-circle centre and final tcp_link target.  This is not
    # the STL export origin or the mesh-placement reference.
    reference_object_position_m: [-0.317806, 0.090, 0.163912]
    surface_plane_tilt_from_world_xy_deg: 55.0
    approach_z_tilt_from_world_xy_deg: -35.0
    orientation_xyzw: [0.0, 0.8870108331782217, 0.0, 0.4617486132350339]
    executable: true
    role: reviewed_collision_free_pre_dock
    retreat_distance_m: 0.030
    retreat_axis_tcp: [0.0, 0.0, -1.0]
  tool2:
    joint_names: [base_joint, shoulder_joint, elbow_joint, wrist_pitch_joint, wrist_roll_joint, wrist_yaw_joint]
    # Imported from config/test/tool2_trajectory.yaml point 16. This is the
    # collision-checked high approach with the final TCP X/Y and Z +95 mm;
    # point 17 is contact/grasp and remains diagnostic only.
    pre_joint_goal_rad: [-2.13180646665643, 0.8056224119758513, 1.2458380150140123,
      -1.4895040589039743, -0.5463633803567056, -0.3205989853677441]
    pre_capture_label: test_tool2_point16_high_approach
    final_capture_label: tool1
    final_joint_goal_rad: [3.034213998437591, 0.6241297112184002, 1.5446163880149817,
      -1.4226177774267788, -0.3451456772744761, -1.7732817907955942]
    joint_goal_rad: [-2.5280003384357435, 0.8353145906571304, 1.5156438585160097,
      -1.5091862255047854, -0.2316310989709387, -0.0828349625456184]
    # Contact/grasp pose: rack_left intentionally touches the supply box here.
    # It must not be used as an ordinary collision-free MoveIt entry goal.
    executable: true
    role: collision_free_pregrasp_95mm_above_contact
    required_prior_stage: collision_free_pregrasp
    required_scene_transition: attach_supply_box_after_grasp_confirmation
    grasp_stage_allowed_contacts:
      - [rack_left, supply_box]
      - [rack_right, supply_box]
    retreat_distance_m: 0.030
    retreat_axis_tcp: [0.0, 0.0, -1.0]
  supply_box_center:
    frame_id: base_actuator
    position_m: [-0.236197, -0.120, 0.182]
    executable: false
    reason: object centre only; TCP grasp offset and approach orientation are not defined
