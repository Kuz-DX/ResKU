# IK launch enables docking by default; only enabled paths receive a docking tail.
# A tool-path request is still required before approach/alignment/advance.
# Before enabling, teach the stored trajectory to end BEFORE contact, with tag visible.
# tag_tcp_stages xyz/xyzw values are TCP poses in the TAG frame (m, quaternion x y z w).
# camera_normal_advance derives alignment from live tag/optical-frame TF instead.
# Never substitute camera pixel centre or raw camera depth for a calibrated 6D pose.
tools:
  0:
    # Keep disabled until physical tag size/frame mapping and a within-margin
    # approach endpoint have been verified; the supplied elbow=1.542 has no margin.
    enabled: false
    alignment_mode: tag_tcp_position
    tag_family: tag36h11
    tag_id: 0
    tag_size_m: null               # measured black square edge length
    # PnP corners 0=bottom-left, 1=bottom-right, 2=top-right, 3=top-left:
    # user +X up, +Y left, +Z out; confirm against live frame before enabling.
    tag_from_user_axes: [[0, -1, 0], [-1, 0, 0], [0, 0, -1]]
    actuation_enabled: false
    desired_docked: true           # true=attach pulse, false=release pulse
    actuation_timeout_s: null      # establish with actual Arduino firmware
    stages:
      - {name: coarse, xyz_m: [-0.050, 0.0, 0.090]}
      - {name: fine, xyz_m: [-0.050, 0.0, 0.080]}
      # Tool TCP target, not camera centre. User-defined tag axes:
      # +X up, +Y left, +Z out of the tag toward the camera.
      # Confirm detector-frame mapping and orientation before enabling motion.
      - {name: dock, xyz_m: [-0.050, 0.0, 0.070]}
    # Conservative starting limits, NOT measured docking accuracy guarantees.
    tag_max_age_s: 0.25
    min_decision_margin: 40.0
    max_reprojection_px: 1.5
    min_tag_edge_px: 30.0
    # Reject near-equal IPPE planar solutions instead of allowing pose flips.
    min_pnp_solution_gap_px: 0.05
    tf_timeout_s: 0.10
    # The physical rack tag is stationary in base coordinates.
    max_tag_position_jump_m: 0.005
    max_tag_angle_jump_rad: 0.05
    position_tolerance_m: 0.002
    angle_tolerance_rad: 0.02
    step_m: 0.002
    step_rad: 0.01
    max_position_error_m: 0.05
    max_angle_error_rad: 0.25
    joint_step_rad: 0.03
    joint_speed_rad_s: 0.025
    linear_speed_m_s: 0.005
    angular_speed_rad_s: 0.05
    stopped_speed_rad_s: 0.01
    joint_tolerance_rad: 0.005
    stable_samples: 5
    acquire_timeout_s: 10.0
    sequence_timeout_s: 180.0
  1:
    enabled: true
    # Confirmed physical rack tag for tool 1 (2026-10-28).
    # Detector family: tag36h11, matching the vision.apriltag default.
    # Tag plane is 55 degrees to the horizontal circuit-box top.
    # Camera image plane should align parallel to the tag plane on approach.
    # Confirm a stopped tool-1 endpoint and fresh tag samples, then advance
    # RELATIVE 30 mm along the observed tag normal. Tilt the camera axis
    # gradually toward that normal during advance; axial rotation is free.
    # No separate centering/alignment motion. All six arm joints participate.
    # This is NOT a final camera-to-tag distance of 30 mm.
    # No FK endpoint from tool1_trajectory.yaml is read or used.
    # Tag loss during confirmation cancels; after the direction is locked the
    # checked advance may finish without tag visibility. Feedback remains mandatory.
    # One tool-1 request starts the path and its automatic docking continuation.
    require_l2_hold: false
    alignment_mode: camera_normal_advance
    tag_family: tag36h11
    tag_id: 1
    tag_size_m: 0.020             # measured outer black square, excluding white margin
    advance_distance_m: 0.030
    actuation_enabled: false     # finish in HOLD, no attach/release command
    tag_max_age_s: 0.25
    min_decision_margin: 40.0
    max_reprojection_px: 1.5
    min_tag_edge_px: 30.0
    min_pnp_solution_gap_px: 0.05
    tf_timeout_s: 0.10
    max_tag_position_jump_m: 0.005
    max_tag_angle_jump_rad: 0.05
    position_tolerance_m: 0.002
    angle_tolerance_rad: 0.02
    step_m: 0.002
    step_rad: 0.01
    max_position_error_m: 0.05
    max_angle_error_rad: 0.25
    joint_step_rad: 0.03
    joint_speed_rad_s: 0.025
    linear_speed_m_s: 0.005
    angular_speed_rad_s: 0.05
    stopped_speed_rad_s: 0.01
    joint_tolerance_rad: 0.005
    stable_samples: 5
    acquire_timeout_s: 10.0
    sequence_timeout_s: 180.0
  2:
    enabled: false
