# IK launch enables docking by default; only enabled paths receive a docking tail.
# A tool-path request is still required before approach/alignment/advance.
# Before enabling, teach the stored trajectory to end BEFORE contact, with tag visible.
# tag_tcp_stages xyz/xyzw values are TCP poses in the TAG frame (m, quaternion x y z w).
# camera_normal_advance derives alignment from live tag/optical-frame TF instead.
# Never substitute camera pixel centre or raw camera depth for a calibrated 6D pose.
tools:
  0:
    enabled: true
    require_l2_hold: false
    alignment_mode: fixed_joint_goal
    # FK-verified planar TCP-axis insertion, sampled every 1 mm.
    axial_sampled_path: true
    maintain_entry_orientation: true
    # This confirmed pre-dock is outside the tag FOV. Do not reacquire a tag;
    # move to the hand-confirmed final docking joint pose below.
    measured_pre_dock_alignment_enabled: false
    tag_family: tag36h11
    tag_id: 0
    tag_size_m: 0.020
    # 29 mm -> 1 mm before the final TCP, along its -Z axis.
    intermediate_joint_goals_rad:
      - [-3.14159265358979, 0.134207876680202, 1.05989362671532, -1.32610237788455, 0, 0]
      - [-3.14159265358979, 0.132653235573069, 1.0625049583756, -1.32193640511714, 0, 0]
      - [-3.14159265358979, 0.131075217547649, 1.06508074453284, -1.31778260093448, 0, 0]
      - [-3.14159265358979, 0.129473949771292, 1.06762115448416, -1.3136409232068, 0, 0]
      - [-3.14159265358979, 0.127849557563437, 1.07012635313514, -1.30951133234796, 0, 0]
      - [-3.14159265358979, 0.126202164455738, 1.07259650111721, -1.3053937912582, 0, 0]
      - [-3.14159265358979, 0.124531892249951, 1.07503175490087, -1.30128826526875, 0, 0]
      - [-3.14159265358979, 0.122838861073713, 1.07743226690522, -1.29719472208816, 0, 0]
      - [-3.14159265358979, 0.12112318943426, 1.07979818560363, -1.2931131317503, 0, 0]
      - [-3.14159265358979, 0.119384994270167, 1.08212965562589, -1.28904346656394, 0, 0]
      - [-3.14159265358979, 0.117624391001196, 1.08442681785694, -1.28498570106392, 0, 0]
      - [-3.14159265358979, 0.115841493576312, 1.08668980953227, -1.28093981196371, 0, 0]
      - [-3.14159265358979, 0.114036414519925, 1.08891876433018, -1.27690577810942, 0, 0]
      - [-3.14159265358979, 0.112209264976443, 1.09111381246095, -1.27288358043517, 0, 0]
      - [-3.14159265358979, 0.11036015475317, 1.09327508075311, -1.26887320191973, 0, 0]
      - [-3.14159265358979, 0.108489192361636, 1.09540269273686, -1.26487462754444, 0, 0]
      - [-3.14159265358979, 0.106596485057379, 1.0974967687248, -1.26088784425225, 0, 0]
      - [-3.14159265358979, 0.104682138878263, 1.09955742588996, -1.25691284090797, 0, 0]
      - [-3.14159265358979, 0.10274625868136, 1.10158477834137, -1.25294960825966, 0, 0]
      - [-3.14159265358979, 0.100788948178459, 1.1035789371972, -1.24899813890093, 0, 0]
      - [-3.14159265358979, 0.0988103099702325, 1.10554001065547, -1.24505842723443, 0, 0]
      - [-3.14159265358979, 0.0968104455791127, 1.10746810406257, -1.24113046943621, 0, 0]
      - [-3.14159265358979, 0.0947894554809236, 1.10936331997955, -1.23721426342104, 0, 0]
      - [-3.14159265358979, 0.0927474391352933, 1.11122575824629, -1.23330980880867, 0, 0]
      - [-3.14159265358979, 0.0906844950148979, 1.11305551604364, -1.22941710689093, 0, 0]
      - [-3.14159265358979, 0.0886007206335673, 1.11485268795355, -1.22553616059969, 0, 0]
      - [-3.14159265358979, 0.0864962125732912, 1.11661736601737, -1.22166697447559, 0, 0]
      - [-3.14159265358979, 0.084371066510149, 1.11834963979219, -1.21780955463763, 0, 0]
      - [-3.14159265358979, 0.0822253772392105, 1.12004959640547, -1.21396390875341, 0, 0]
    final_joint_goal_rad: [-3.14159265358979, 0.0800592386984226, 1.12171732060792, -1.21013004601018, 0, 0]
    actuation_enabled: true
    desired_docked: true           # true=attach pulse, false=release pulse
    actuation_timeout_s: 10.0
    # Measured tag-to-final-TCP translation, expressed in the confirmed
    # tag/TCP-aligned axes: +X up, +Y left, +Z from TCP toward the box.
    # Final TCP is therefore below and in front of the tag centre.
    measured_tag_tcp_xyz_m: [-0.0457, 0.0, -0.05157]
    measured_tag_tcp_xyzw: [0.0, 0.0, 0.0, 1.0]
    measured_pre_dock_30mm_xyz_m: [-0.0457, 0.0, -0.08157]
    stages:
      - {name: coarse, xyz_m: null, xyzw: null}
      - {name: fine, xyz_m: null, xyzw: null}
      - {name: dock, xyz_m: null, xyzw: null}
    # Conservative starting limits, NOT measured docking accuracy guarantees.
    tag_max_age_s: 0.25
    min_decision_margin: 40.0
    max_reprojection_px: 1.5
    min_tag_edge_px: 30.0
    # Reject near-equal IPPE planar solutions instead of allowing pose flips.
    min_pnp_solution_gap_px: 0.05
    tf_timeout_s: 0.10
    # The physical rack tag is stationary in base coordinates.
    max_tag_position_jump_m: 0.005
    max_tag_angle_jump_rad: 0.05
    position_tolerance_m: 0.002
    angle_tolerance_rad: 0.02
    step_m: 0.002
    step_rad: 0.01
    # The repeatable HOLD endpoint can be roughly 0.18--0.20 m from the
    # tag-derived pre-dock point. Every 2 mm correction is still IK/collision
    # checked; this only widens the initial target-envelope rejection gate.
    max_position_error_m: 0.25
    # Measured tool-0 pre-dock tag/camera-axis tilt is 0.284 rad. This gate
    # validates the observed advance direction; the checked 30 mm trajectory
    # still preserves the taught TCP orientation and all IK/collision limits.
    max_angle_error_rad: 0.35
    joint_step_rad: 0.03
    joint_speed_rad_s: 0.025
    linear_speed_m_s: 0.005
    angular_speed_rad_s: 0.05
    stopped_speed_rad_s: 0.01
    joint_tolerance_rad: 0.005
    stable_samples: 5
    acquire_timeout_s: 10.0
    sequence_timeout_s: 180.0
  1:
    enabled: true
    # Confirmed physical rack tag for tool 1 (2026-10-28).
    # Detector family: tag36h11, matching the vision.apriltag default.
    # Tag plane is 55 degrees to the horizontal circuit-box top.
    # Camera image plane should align parallel to the tag plane on approach.
    # Confirm a stopped tool-1 endpoint and fresh tag samples, then advance
    # RELATIVE 30 mm along the observed tag normal. Tilt the camera axis
    # gradually toward that normal during advance; axial rotation is free.
    # No separate centering/alignment motion. All six arm joints participate.
    # This is NOT a final camera-to-tag distance of 30 mm.
    # No FK endpoint from tool1_trajectory.yaml is read or used.
    # Tag loss during confirmation cancels; after the direction is locked the
    # checked advance may finish without tag visibility. Feedback remains mandatory.
    # One tool-1 request starts the path and its automatic docking continuation.
    require_l2_hold: false
    alignment_mode: camera_normal_advance
    maintain_entry_orientation: true
    measured_pre_dock_alignment_enabled: true
    tag_family: tag36h11
    tag_id: 1
    tag_size_m: 0.020             # measured outer black square, excluding white margin
    advance_distance_m: 0.030
    # Confirmed tag/TCP-aligned measurement. The current camera-normal mode
    # does not yet consume the lateral X offset; retain it explicitly so the
    # next tag-relative staged approach cannot silently lose this geometry.
    measured_tag_tcp_xyz_m: [-0.0457, 0.0, -0.0500]
    measured_tag_tcp_xyzw: [0.0, 0.0, 0.0, 1.0]
    measured_pre_dock_30mm_xyz_m: [-0.0457, 0.0, -0.0800]
    # Hand-guided final docking capture. Diagnostic reference only: elbow
    # 1.590693 rad exceeds the configured 1.5779521-rad endpoint, so this must
    # not be submitted as an executable MoveIt/managed-path goal until the
    # encoder zero/limit discrepancy is resolved from raw motor feedback.
    measured_final_dock_joint_rad: [2.779573, 0.693943, 1.590693,
      -1.389980, -0.085903, -1.805495]
    measured_final_dock_executable: false
    measured_final_dock_blocker: elbow exceeds configured soft limit by 0.0127409 rad
    # The joystick request owns the complete sequence: final tag-normal
    # approach, Arduino attach, checked TCP retreat, then direct MoveIt BACK.
    actuation_enabled: true
    desired_docked: true
    actuation_timeout_s: 10.0
    tag_max_age_s: 0.25
    min_decision_margin: 40.0
    max_reprojection_px: 1.5
    min_tag_edge_px: 30.0
    min_pnp_solution_gap_px: 0.05
    tf_timeout_s: 0.10
    max_tag_position_jump_m: 0.005
    max_tag_angle_jump_rad: 0.05
    position_tolerance_m: 0.002
    angle_tolerance_rad: 0.02
    step_m: 0.002
    step_rad: 0.01
    max_position_error_m: 0.05
    max_angle_error_rad: 0.25
    joint_step_rad: 0.03
    joint_speed_rad_s: 0.025
    linear_speed_m_s: 0.005
    angular_speed_rad_s: 0.05
    stopped_speed_rad_s: 0.01
    joint_tolerance_rad: 0.005
    stable_samples: 5
    acquire_timeout_s: 10.0
    sequence_timeout_s: 180.0
  2:
    enabled: false
