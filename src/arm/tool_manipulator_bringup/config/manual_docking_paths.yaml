version: 1

# Captured joint solutions are replayed as joint-space waypoints. They are
# already IK solutions; no Cartesian pose was captured from which to solve IK
# again. Every waypoint includes arm_controller's six joints plus ee_joint.
joint_names:
  [base_joint, shoulder_joint, elbow_joint, wrist_pitch_joint,
   wrist_roll_joint, wrist_yaw_joint, ee_joint]

