# User-supplied tool 2 approach: 1 -> 2 -> 3 -> 4 -> 5, close ee_joint,
# then retrace 5 -> 4 -> 3 -> 2 -> 1. Nominal segments are 20 seconds;
# the mode manager may extend them to respect its loaded-arm speed limits.
# Disabled until taught coordinates and configured limits are reconciled:
# shoulder points 2..5 exceed 1.518; elbow point 4 exceeds 1.542;
# wrist_roll point 5 is below -0.75. The 0.02-rad margin also excludes
# elbow point 3. Do not clip recorded coordinates or bypass validation.
execution_enabled: false
joint_names: [base_joint, shoulder_joint, elbow_joint, wrist_pitch_joint, wrist_roll_joint, wrist_yaw_joint]
after_path:
  # Existing measured gripper closed position (raw 2808, zero raw 1992).
  ee_close_rad: 1.251728
  return_to_start: true
