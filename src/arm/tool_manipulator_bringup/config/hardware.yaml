# 실기 제어용 단일 설정 원본.
# null은 아직 실측하지 않음을 뜻한다. hardware_preflight.py는 null 또는
# 범위가 맞지 않는 항목이 하나라도 있으면 실패하며, real_control.launch.py도
# controller_manager를 시작하지 않는다. 값을 추정해서 채우지 않는다.
version: 1

buses:
  # U2D2 has one USB serial endpoint. TTL and RS-485 are separate electrical
  # output channels: status feedback is read ID-by-ID, while Protocol 2
  # Sync Write remains one transmit-only coordinated command. Physical B topology:
  # TTL -> base ID 1 and branch wrist_yaw ID 3 -> ee_joint ID 4;
  # RS-485 -> wrist_roll ID 2.
  dynamixel_u2d2:
    device: /dev/ttyUSB0
    baud_rate: 1000000
    protocol: 2.0
    adapter: U2D2
    mixed_ttl_rs485: true
    feedback_mode: individual_read
    command_mode: sync_write
  rmd_can:
    interface: can_arm
    bitrate: 1000000

joints:
  base_joint:
    vendor: dynamixel
    model: XH540-W270-T
    bus: dynamixel_u2d2
    transport_channel: ttl
    id: 1
    operating_mode: 4
    raw_increases_ccw: true
    zero_raw: 0
