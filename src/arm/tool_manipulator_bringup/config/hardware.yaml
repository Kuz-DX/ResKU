version: 1
buses:
  dynamixel_u2d2:
    device: /dev/ttyUSB0
    baud_rate: 1000000
    protocol: 2.0
    adapter: U2D2
    mixed_ttl_rs485: true
    feedback_mode: individual_read
    command_mode: sync_write
    # Diagnostic register reads disturb the shared U2D2 control cadence; keep
    # disabled during normal motion and enable only for supervised diagnosis.
    position_diagnostics: false
    position_diagnostics_period_ms: 1000
  rmd_can:
    interface: can_arm
    bitrate: 1000000
joints:
  base_joint:
    vendor: dynamixel
    model: XH540-W270-T
    bus: dynamixel_u2d2
    transport_channel: ttl
    id: 1
    operating_mode: 4
    raw_increases_ccw: true
    zero_raw: 20
    soft_limit_raw:
    - -2264
    - 2376
    soft_limit_rad:
    - -3.503
    - 3.614
    velocity_limit_rad_s: 0.48
    current_limit_ma: 5506.43
    current_limit_raw: 2047
    # Upper controller supplies bounded position samples; disable motor profiling.
    velocity_limit_raw: 200
    profile_acceleration_raw: 0
    profile_velocity_raw: 0
    # Conservative integral-gain trial for small-error stiction; raw register 82.
    position_i_gain_raw: 20
  # RMD measurement 2026-10-22: upright is raw/joint zero.
  # joint_rad = sign * raw_deg * pi / 180; endpoint readings are motor degrees.
  shoulder_joint:
    vendor: rmd
    model: X8
    bus: rmd_can
    id: 4
    sign: -1
    q_offset_rad: 0.0
    # Raw endpoints: bent 91.25 deg, extended -86.979 deg; sign=-1.
    soft_limit_rad:
    - -1.592
    - 1.518
    velocity_limit_rad_s: 0.35
    current_limit_a: 4.0
    current_release_threshold_a: 3.0
    current_retreat_velocity_rad_s: 0.1
    current_max_retreat_distance_rad: 0.052
    current_limit_duration_ms: 100
  elbow_joint:
    vendor: rmd
    model: X6
    bus: rmd_can
    id: 5
    sign: -1
    q_offset_rad: 0.0
    # Raw endpoints: bent -88.389 deg, extended 85.819 deg; sign=-1.
    soft_limit_rad:
    - -1.497
    - 1.542
    velocity_limit_rad_s: 0.3
    # User-requested elbow X6-60 limit; retain release and retreat protection.
    current_limit_a: 5.0
    current_release_threshold_a: 2.2
    current_retreat_velocity_rad_s: 0.1
    current_max_retreat_distance_rad: 0.052
    current_limit_duration_ms: 100
  wrist_pitch_joint:
    vendor: rmd
    model: X4
    bus: rmd_can
    id: 6
    sign: 1
    q_offset_rad: 0.0
    # Raw endpoints: bent 84.259 deg, extended -91.239 deg; sign=+1.
    soft_limit_rad:
    - -1.592
    - 1.470
    velocity_limit_rad_s: 0.3
    # Tool-2 no-load approach measurement 2026-10-28: collision-checked motion
    # at 0.006 rad/s repeatedly needed 2.02..2.33 A.  The former 2.0 A limit
    # therefore relaxed the target during normal gravity-loaded travel and
    # eventually created a 0.152-rad following error.  Keep modest headroom
    # above that measured peak; any protection event still aborts managed paths.
    current_limit_a: 2.5
    current_release_threshold_a: 1.8
    current_retreat_velocity_rad_s: 0.1
    current_max_retreat_distance_rad: 0.052
    current_limit_duration_ms: 100
  wrist_roll_joint:
    vendor: dynamixel
    model: MX-106R
    bus: dynamixel_u2d2
    transport_channel: rs485
    id: 2
    operating_mode: 4
    raw_increases_ccw: true
    zero_raw: -1
    # Measured safe endpoints: raw -628 / 443 with zero_raw -1.
    # Keep about 0.032 rad inside each endpoint; do not change the zero.
    soft_limit_raw:
    - -607
    - 422
    soft_limit_rad:
    - -0.93
    - 0.65
    velocity_limit_rad_s: 0.24
    current_limit_ma: 6877.92
    current_limit_raw: 2047
    # Upper controller supplies bounded position samples; disable motor profiling.
    velocity_limit_raw: 200
    profile_acceleration_raw: 0
    profile_velocity_raw: 0
    # Conservative integral-gain trial for small-error stiction; raw register 82.
    position_i_gain_raw: 20
  wrist_yaw_joint:
    vendor: dynamixel
    model: MX-106T
    bus: dynamixel_u2d2
    transport_channel: ttl
    id: 3
    operating_mode: 4
    raw_increases_ccw: false
    zero_raw: -4071
    soft_limit_raw:
    - -8308
    - -317
    soft_limit_rad:
    - -5.76
    - 6.5
    velocity_limit_rad_s: 0.24
    current_limit_ma: 6877.92
    current_limit_raw: 2047
    # Upper controller supplies bounded position samples; disable motor profiling.
    velocity_limit_raw: 200
    profile_acceleration_raw: 0
    profile_velocity_raw: 0
    # Conservative integral-gain trial for small-error stiction; raw register 82.
    position_i_gain_raw: 20
  ee_joint:
    vendor: dynamixel
    model: MX-106T
    bus: dynamixel_u2d2
    transport_channel: ttl
    id: 4
    operating_mode: 1
    raw_increases_ccw: true
    # Gripper pinion zero: measured raw 1992 = q 0 rad. Keep this aligned
    # with tool_1_gripper.xacro; changing it displaces both mimic racks.
    zero_raw: 1992
    velocity_limit_rad_s: 9.58764908  # MX-106(2.0) Goal Velocity Decimal 400
    current_limit_ma: 6877.92
    current_limit_raw: 2047
    velocity_limit_raw: 400
    profile_acceleration_raw: 5
    profile_velocity_raw: 10
